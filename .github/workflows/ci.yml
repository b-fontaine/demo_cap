name: ci
on: [pull_request, push]
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace
      # P1 : à activer par l'intégrateur une fois `mandat check` livré.
      # - run: cargo run -q -p mandat-cli -- check --branch "${{ github.head_ref }}"

name: ci
on: [pull_request, push]
jobs:
  gates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with: { fetch-depth: 0 }
      - uses: dtolnay/rust-toolchain@stable
      - run: cargo test --workspace
      # Garde-fou mandat : le mandat de la feature en cours doit rester valide.
      - run: cargo run -q -p mandat-cli -- check FEAT-042

[package]
name = "mandat-cli"
edition.workspace = true
license.workspace = true
version.workspace = true

[[bin]]
name = "mandat"
path = "src/main.rs"

[dependencies]
chrono = "0.4.45"
clap = { version = "4.6.7", features = ["derive"] }
gherkin = "0.16.0"
mandat-core = { version = "0.1.0", path = "../mandat-core" }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
toml = "1.1.6"

[dev-dependencies]
assert_cmd = "2.2.2"
tempfile = "3.27.0"
